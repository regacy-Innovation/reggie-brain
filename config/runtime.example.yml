# Copy values to the runner's local secret configuration. Do not commit secrets.
# Set REGGIE_ROLE in the runner process environment to an ID in config/roles.yml.
# Do not copy role instructions into this file or into .env.
roles_registry_path: C:/Reggie/brain/config/roles.yml
timezone: Asia/Tokyo
# 09:00 UTC
daily_summary_time: "18:00"
# Slack authorization, permitted channel IDs, and the @Reggie Agent member ID are local agent configuration.
workspace_root: C:/Reggie
brain_repository_path: C:/Reggie/brain
project_clone_root: C:/Reggie/projects
worktree_root: C:/Reggie/worktrees
state_root: C:/Reggie/state
mission_record_root: C:/Reggie/brain/missions
# Configure the designated Linear document or knowledge-space URL locally.
# Daily knowledge, thoughts, memos, ideas, and improvements are stored there,
# not in the GitHub brain repository.
linear_knowledge_document_url: https://linear.app/<workspace>/document/<document-id>
artifact_root: C:/Reggie/artifacts
projects_registry_path: C:/Reggie/brain/config/projects.yml
